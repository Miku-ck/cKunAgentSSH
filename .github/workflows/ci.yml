# CI — cKunAgentSSH
#
# 说明：当前仓库托管在 Gitee。本文件是标准 GitHub Actions 配置，
# 推送到 GitHub（或 fork）即自动生效；在 Gitee 上可用 Gitee Go 等价配置，
# 或直接在本地跑 `bash scripts/ci-check.sh` 执行完全相同的检查项。
#
# 检查项（与 scripts/ci-check.sh 一致）：
#   1. 后端 pytest（backend/tests/，含跨端白名单契约测试）
#   2. 后端 lint 闸门（ruff --select F,E9：未用导入/未定义名/语法错，全库 0 命中）
#   3. 前端 vue-tsc 类型检查
#   4. 前端 vitest 单测
#   5. electron-vite 构建（验证 main/preload/renderer 三方编译）
#   6. 网关 mux 字节漂移自检（hillgw.mjs 与 shared/gateway-mux.ts 双实现金样对拍）
#
# 本文件的形状由 backend/tests/test_ci_matrix_contract.py 钉住：改这里必须同步改那里。
# 拆两条单 OS job 而不是 runs-on 矩阵：矩阵逼着每个 step 挂 if: matrix.os，
# 三处平台差异（pip 装法、pytest 只在 Linux 跑、Windows 多一步打包）会把 yml
# 淹在守卫里，而漏挂一次正好是最难查的静默绿。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # node-pty 需在本机构建二进制；ubuntu 上仅做类型检查/构建，
      # 构建失败不阻断（与本地 postinstall 的 install-app-deps 一致的策略）。
      # Windows job 里这一手是禁用的，见 check-windows 的注释。
      - name: Build native deps (best effort)
        run: npm run postinstall || true

      - name: Backend tests
        # 与本地 scripts/ci-check.sh 同一条命令，收集范围只有一个来源（npm run test:backend）
        run: npm run test:backend

      # 只钉「死代码 + 必炸错误」两类（F=未用导入/未定义名，E9=语法错），全库 0 命中。
      # 宽规则集那 1100+ 条存量告警是 ruff.toml 首行与 docs/superpowers 记录的
      # 「渐进式整改、非本次范围」，在这里扩规则集只会把永久红灯变成惯例。
      # Windows job 没有 setup-python（那条 job 的 Python 是 runtime/ 内嵌的），
      # 所以 lint 只在 ubuntu 上跑一次，与后端 pytest 同一位置。
      - name: Backend lint (ruff F,E9)
        # 与 npm run lint:backend / scripts/ci-check.sh 同一条命令，口径只有一个来源
        run: npm run lint:backend

      - name: Gateway mux selftest
        # hillgw.mjs 与 shared/gateway-mux.ts 两套实现的帧格式金样；不跑就等于没有守卫
        run: node gateway/hillgw.mjs --selftest

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # 交付目标是 Windows-only（tar 解包直发），可此前所有缺陷与修复都发生在
  # Windows，CI 却没有一条 Windows job：node_modules/ 被 .gitignore 忽略，锁文件是
  # 在 Linux 上解析出来的，而 node-pty / ssh2 的 .node 到了 Windows 要走 MSVC 重编，
  # asarUnpack 规则与 dir 产物 + tar 出件也只有 Windows runner 验得了。
  # 这里先求「跑起来」：装依赖 + 三条前端闸门 + 构建 + 打包，不追求产物细节。
  check-windows:
    name: Gates + package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 不加 `|| true`：装不上或原生模块编不过，就是要在这里红。开发机的
      # node_modules 是存量（带 binding.gyp 的包早就编好了），CI 上是全新解析，
      # 两者不是一回事 —— 这正是这条 job 存在的理由。postinstall
      # （electron-builder install-app-deps）由 npm ci 自动触发，会在 MSVC 工具链
      # 下重编 node-pty/ssh2。
      - name: Install dependencies (原生重编失败必须可见)
        run: npm ci

      - name: Gateway mux selftest
        # 与 ubuntu job 同一条：数据面两侧的字节一致性不分平台
        run: node gateway/hillgw.mjs --selftest

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # 发布包必须自带 Python：AI 侧要跑后端，后端要一个装了 fastapi/uvicorn 的解释器，
      # 否则装到用户机器上就是"能开但全灭"。scripts/package.js 在没有 runtime/ 时会
      # 直接 exit 1（取舍：宁可不发版，也不发一个 AI 全灭的包），
      # 所以这一步是硬前置，不是优化。
      # 制备逻辑只有一份实现：scripts/prepare-runtime.ps1（python-build-standalone 的
      # install_only_stripped + pip install + 字节码预编译）。本地 npm run prepare:runtime
      # 调的是同一个脚本 —— 以前这里内联一份、README 描述另一份，两边会各自漂移。
      - name: Prepare embedded Python runtime
        shell: pwsh
        env:
          # 作业自带的只读 token：裸调 api.github.com 是按 IP 限流的，共享 runner
          # IP 上这条 job 会变成随机红，而失败点看起来像"上游没资产"。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -NoProfile -File ./scripts/prepare-runtime.ps1

      # 打包真跑一次：files/asarUnpack 规则能不能把 node-pty/ssh2 的 .node 放对位置、
      # dir 产物 + tar 出件能否成立，都只在 Windows runner 上验得了。
      - name: Package (tar.gz)
        run: npm run package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cKunAgentSSH-windows-tar
          path: dist/*.tar.gz
          if-no-files-found: error
